<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAMB CBT Exam</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1 id="subjectTitle">JAMB CBT</h1>

    <div id="timer">
        Time Left: <span>60:00</span>
    </div>

    <div class="question-box">

        <h2 id="question">
            Loading question...
        </h2>

        <div id="answers"></div>

    </div>

    <div class="buttons">
        <button id="prevBtn">Previous</button>
        <button id="nextBtn">Next</button>
        <button id="submitBtn">Submit</button>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
